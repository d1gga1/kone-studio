# Kone Moctar Studio - configurazione Netlify
[build]
  publish = "."

# Funzione che collega il motore dei corsi a Claude (serve ANTHROPIC_API_KEY)
[functions]
  directory = "netlify/functions"

# Il sito vetrina e' index.html; l'app vive in app.html.
# /app e /coach (ingresso riservato al pannello) aprono l'app.
[[redirects]]
  from = "/coach"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/coach/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

# Qualsiasi altro indirizzo che non esiste torna al sito
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# L'app non va messa in cache: cosi' ogni pubblicazione si vede subito
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icone e immagini: cache lunga
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
