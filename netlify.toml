# Kone Moctar Studio - configurazione Netlify
[build]
  publish = "."

# Funzione che collega il motore dei corsi a Claude (serve ANTHROPIC_API_KEY)
[functions]
  directory = "netlify/functions"

# Il sito vetrina e' index.html; l'app vive in app.html.
# /app e /coach (ingresso riservato al pannello) aprono l'app.
[[redirects]]
  from = "/coach"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/coach/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

# Qualsiasi altro indirizzo che non esiste mostra il sito, ma con codice 404:
# cosi' Google non indicizza pagine inesistenti come copie della home ("soft 404").
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# L'app non va messa in cache: cosi' ogni pubblicazione si vede subito
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icone e immagini: cache lunga
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SEO: le pagine dell'app e di prova non devono comparire su Google
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/coach/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/intro.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Sicurezza HTTPS (segnale di qualita' per Google)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
