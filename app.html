ht:400;font-display:swap;src:url(/assets/fonts/barlow-400-italic.woff2) format('woff2')}@font-face{font-family:'Barlow';font-style:italic;font-weight:500;font-display:swap;src:url(/assets/fonts/barlow-500-italic.woff2) format('woff2')}</style>
<style>
:root{
  --ink:#08080A; --ink-2:#101013; --surf:#16161A; --surf-2:#1D1D22; --surf-3:#26262C;
  --line:#2E2E35; --line-soft:#232329;
  --gold:#D9A93C; --gold-hi:#F7E3A1; --gold-mid:#E8C463; --gold-deep:#8A6415;
  --txt:#F3EFE6; --txt-2:#A9A296; --txt-3:#726C62;
  --ok:#4FA86A; --warn:#E0973A; --crit:#CE4B45; --info:#5C8BC4;
  --r:14px; --r-sm:9px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.85);
  --sans:'Barlow','Barlow Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Oswald','Oswald Fallback','Barlow Condensed',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--txt);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
.muted{color:var(--txt-2)}
.dim{color:var(--txt-3)}

/* ============ INTRO / SPLASH ============ */
#splash{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 40%,#1A150A 0%,#0B0A07 45%,#050505 100%);
  perspective:1400px;transition:opacity .7s ease,visibility .7s;
}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.stage{position:relative;width:min(86vw,560px);aspect-ratio:1;transform-style:preserve-3d;
  animation:stageIn 1.2s cubic-bezier(.16,.84,.34,1) both, stageFloat 7s 1.3s ease-in-out infinite;}
@keyframes stageIn{from{opacity:0;transform:translateZ(-380px) rotateX(24deg)}to{opacity:1;transform:none}}
@keyframes stageFloat{0%,100%{transform:rotateY(-7deg) rotateX(3deg)}50%{transform:rotateY(7deg) rotateX(-3deg)}}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.glow{position:absolute;inset:-14%;border-radius:50%;
  background:radial-gradient(circle,rgba(217,169,60,.30) 0%,rgba(217,169,60,.07) 42%,transparent 68%);
  filter:blur(22px);animation:pulse 4.2s ease-in-out infinite;transform:translateZ(-80px)}
@keyframes pulse{0%,100%{opacity:.55;transform:translateZ(-80px) scale(.95)}50%{opacity:1;transform:translateZ(-80px) scale(1.06)}}

.ring-outer{stroke-dasharray:1570;stroke-dashoffset:1570;animation:draw 1.5s .15s cubic-bezier(.4,0,.2,1) forwards}
.ring-inner{stroke-dasharray:1430;stroke-dashoffset:1430;animation:draw 1.5s .35s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

#gK{opacity:0;animation:flyL .95s .75s cubic-bezier(.18,.9,.28,1) forwards;transform-origin:30% 50%}
#gM{opacity:0;animation:flyR .95s .88s cubic-bezier(.18,.9,.28,1) forwards;transform-origin:70% 50%}
@keyframes flyL{0%{opacity:0;transform:translate3d(-190px,0,-240px) rotateY(-72deg)}100%{opacity:1;transform:none}}
@keyframes flyR{0%{opacity:0;transform:translate3d(190px,0,-240px) rotateY(72deg)}100%{opacity:1;transform:none}}
#gBar{opacity:0;animation:popIn .7s 1.45s cubic-bezier(.2,1.5,.4,1) forwards;transform-origin:22% 50%}
#gMass{opacity:0;animation:popIn .7s 1.60s cubic-bezier(.2,1.5,.4,1) forwards;transform-origin:78% 48%}
@keyframes popIn{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:none}}
#gStudio{opacity:0;animation:studioIn .9s 1.75s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes studioIn{0%{opacity:0;letter-spacing:1.4em}100%{opacity:1;letter-spacing:.34em}}
.rule{transform:scaleX(0);transform-origin:center;animation:ruleIn .8s 1.95s cubic-bezier(.3,.9,.3,1) forwards}
@keyframes ruleIn{to{transform:scaleX(1)}}
#gTag{opacity:0;animation:fadeUp .8s 2.15s ease forwards}
#gPill{opacity:0;animation:fadeUp .8s 2.40s ease forwards}
@keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
.shine{animation:shine 3.4s 2.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes shine{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(200%) skewX(-18deg)}}
.spark{opacity:0;animation:spark 3.6s linear infinite}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translateY(-190px) scale(.2)}}
.skip{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:101;font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);
  border:1px solid var(--line);padding:9px 16px;border-radius:99px;background:rgba(10,10,12,.6);backdrop-filter:blur(6px);
  opacity:0;animation:fadeUp .6s 1s ease forwards}
.skip:hover{color:var(--gold);border-color:var(--gold-deep)}
@media (prefers-reduced-motion:reduce){
  .stage,#gK,#gM,#gBar,#gMass,#gStudio,#gTag,#gPill,.rule,.ring-outer,.ring-inner,.shine,.spark,.glow{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}

.logo-off{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%;
  animation:logoIn 1.5s .1s cubic-bezier(.16,.84,.34,1) both;filter:drop-shadow(0 0 28px rgba(217,169,60,.35))}
@keyframes logoIn{0%{opacity:0;transform:scale(.82) rotateY(-28deg);filter:brightness(.3) drop-shadow(0 0 0 rgba(217,169,60,0))}60%{opacity:1;filter:brightness(1.25) drop-shadow(0 0 40px rgba(217,169,60,.6))}100%{opacity:1;transform:none}}
img.auth-mark{display:block;border-radius:50%;box-shadow:0 0 30px -6px rgba(217,169,60,.45)}
img.tb-mark{border-radius:50%}
@media (prefers-reduced-motion:reduce){.logo-off{animation:none}}
/* ============ AUTH ============ */
#auth{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;
  background:radial-gradient(90% 70% at 50% 25%,#15120A 0%,#0A0A0C 60%,#070708 100%);overflow:auto}
#auth.show{display:grid;animation:fadeUp .5s ease both}
.auth-card{width:min(100%,430px);text-align:center}
.auth-mark{width:104px;height:104px;margin:0 auto 22px}
.auth-title{font-size:clamp(30px,7vw,40px);line-height:1;letter-spacing:.02em;text-transform:uppercase}
.auth-title span{color:var(--gold)}
.roles{display:grid;gap:12px;margin-top:28px}
.role{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border:1px solid var(--line);
  border-radius:var(--r);background:linear-gradient(160deg,var(--surf-2),var(--surf));transition:.22s}
.role:hover{border-color:var(--gold-deep);background:linear-gradient(160deg,#241E10,var(--surf-2));transform:translateY(-2px)}
.role-ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(150deg,var(--gold-mid),var(--gold-deep));color:#141006}
.role b{display:block;font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase}
.role small{color:var(--txt-2);font-size:13px}
.auth-foot{margin-top:26px;font-size:12px;color:var(--txt-3);letter-spacing:.04em}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:26px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.auth-tabs button{padding:10px;border-radius:9px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-2);transition:.2s}
.auth-tabs button.on{background:linear-gradient(150deg,var(--gold-mid),var(--gold-deep));color:#141006}
.auth-tabs+.auth-form{margin-top:16px}
.auth-form .frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--txt-2);line-height:1.45;margin:2px 0}
.auth-chk input{margin-top:3px;accent-color:#D9A93C;width:16px;height:16px;flex:none}
.auth-coach{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;color:var(--txt-2);font-size:13px;letter-spacing:.03em;transition:.2s}
.auth-coach:hover{border-color:var(--gold-deep);color:var(--gold-mid)}
.piva{display:block;margin-top:10px;color:var(--txt-3);font-size:12px;letter-spacing:.06em}
.piva-pay{margin-top:12px;font-size:12.5px;color:var(--txt-3)}

/* ============ APP SHELL ============ */
#app{display:none;height:100%;flex-direction:column}
#app.show{display:flex}
.topbar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line-soft);background:rgba(12,12,14,.92);backdrop-filter:blur(10px);z-index:20}
.tb-mark{width:34px;height:34px;flex:none}
.tb-name{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.tb-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3);line-height:1;margin-top:3px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{font-family:var(--disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:99px;
  border:1px solid var(--line);color:var(--txt-2);background:var(--surf)}
.chip.gold{border-color:var(--gold-deep);color:var(--gold-mid);background:rgba(217,169,60,.08)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);
  background:var(--surf);color:var(--txt-2)}
.icon-btn:hover{color:var(--gold);border-color:var(--gold-deep)}

.body-row{flex:1;display:flex;min-height:0}
.rail{flex:none;width:214px;border-right:1px solid var(--line-soft);background:#0C0C0E;padding:14px 10px;
  display:flex;flex-direction:column;gap:3px;overflow:auto}
.rail-sec{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--txt-2);
  font-size:14.5px;width:100%;text-align:left;transition:.15s;position:relative}
.nav:hover{background:var(--surf);color:var(--txt)}
.nav.on{background:linear-gradient(90deg,rgba(217,169,60,.16),rgba(217,169,60,.03));color:var(--gold-hi)}
.nav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2.5px;border-radius:2px;background:var(--gold)}
.nav svg{flex:none;opacity:.9}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  display:grid;place-items:center;background:var(--crit);color:#fff}
.nav .badge.soft{background:var(--surf-3);color:var(--txt-2)}

main{flex:1;overflow:auto;overscroll-behavior:contain}
.wrap{padding:22px 24px 40px;max-width:1180px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:clamp(24px,4.2vw,31px);text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.page-head .sub{color:var(--txt-2);font-size:14px;margin-top:4px}
.head-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{font-family:var(--disp);font-size:12.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surf-2);color:var(--txt);transition:.18s}
.btn:hover{border-color:var(--gold-deep);color:var(--gold-hi)}
.btn.primary{background:linear-gradient(150deg,var(--gold-mid),#B98A22);border-color:#B98A22;color:#150F04;font-weight:600}
.btn.primary:hover{background:linear-gradient(150deg,var(--gold-hi),var(--gold));color:#150F04}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.ghost{background:transparent}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.card{background:var(--surf);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 17px}
.card.flat{background:var(--ink-2)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.card-h h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt)}
.card-h .more{margin-left:auto}

.stat{display:flex;flex-direction:column;gap:5px;padding:15px 16px;border-radius:var(--r);
  background:linear-gradient(165deg,var(--surf-2),var(--surf));border:1px solid var(--line-soft)}
.stat .k{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt-3)}
.stat .v{font-family:var(--disp);font-size:29px;font-weight:600;line-height:1;color:var(--txt)}
.stat .v em{font-style:normal;font-size:14px;color:var(--txt-2);margin-left:3px}
.stat .d{font-size:12.5px;color:var(--txt-2)}
.stat.accent{background:linear-gradient(165deg,#2A2210,#1A1509);border-color:var(--gold-deep)}
.stat.accent .v{color:var(--gold-hi)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;
  background:var(--surf-3);color:var(--txt-2);white-space:nowrap}
.pill.ok{background:rgba(79,168,106,.15);color:#7BCB92}
.pill.warn{background:rgba(224,151,58,.15);color:#F0B468}
.pill.crit{background:rgba(206,75,69,.16);color:#E8807A}
.pill.gold{background:rgba(217,169,60,.14);color:var(--gold-mid)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-sm);
  background:var(--ink-2);border:1px solid var(--line-soft);border-left:3px solid var(--line)}
.alert.crit{border-left-color:var(--crit)}
.alert.warn{border-left-color:var(--warn)}
.alert.info{border-left-color:var(--info)}
.alert.ok{border-left-color:var(--ok)}
.pubbar{margin-bottom:14px;align-items:center}.pubbar>div:first-child{flex:1}.pubbar p{margin:2px 0 0}
.pubdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px;box-shadow:0 0 0 3px rgba(79,168,106,.2)}
@media (max-width:600px){.pubbar{flex-wrap:wrap}}
.alert b{font-weight:600;font-size:14px}
.alert p{font-size:13px;color:var(--txt-2);margin-top:2px}
.alert .btn{margin-left:auto;flex:none;align-self:center}

.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.av{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:var(--disp);
  font-weight:600;font-size:15px;color:#150F04;background:linear-gradient(150deg,var(--gold-mid),var(--gold-deep))}
.av.q{background:linear-gradient(150deg,#4A4A55,#2B2B33);color:var(--txt-2)}
.row .nm{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.row .mt{display:block;font-size:12.5px;color:var(--txt-3);line-height:1.3}
.row .rt{margin-left:auto;text-align:right;flex:none}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--disp);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-3);text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--line-soft)}
td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.017)}
.scroll-x{overflow-x:auto;margin:0 -17px;padding:0 17px}

/* ---- progress bars, meters ---- */
.meter{height:6px;border-radius:99px;background:var(--surf-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-mid))}
.meter.ok i{background:linear-gradient(90deg,#2F6E45,#4FA86A)}
.meter.crit i{background:linear-gradient(90deg,#7A2B28,#CE4B45)}

/* ---- workout / set logger ---- */
.ex{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surf);overflow:hidden;margin-bottom:12px}
.ex-h{display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;text-align:left}
.ex-h .thumb{width:46px;height:46px;flex:none;border-radius:10px;background:var(--surf-3);display:grid;place-items:center;color:var(--gold-mid)}
.ex-h .txt{flex:1;min-width:0}
.ex-h .nm{display:block;font-family:var(--disp);font-weight:600;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.2}
.ex-h .mt{display:block;font-size:12.5px;color:var(--txt-3);margin-top:3px;line-height:1.3}
.ex-h .st{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.ex-b{padding:0 15px 14px;display:none}
.ex.open .ex-b{display:block}
.ex.done{border-color:rgba(79,168,106,.35)}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;padding:7px 0}
.setrow.head{padding-bottom:3px}
.setrow.head span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.setrow .idx{font-family:var(--disp);font-size:14px;color:var(--txt-3);text-align:center}
.inp{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;
  font-size:14.5px;text-align:center;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--gold-deep);outline:none}
.tick{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--ink-2);
  display:grid;place-items:center;color:var(--txt-3);margin:0 auto}
.tick.on{background:rgba(79,168,106,.18);border-color:#3D7F54;color:#7BCB92}
.lastload{font-size:12px;color:var(--txt-3);padding:8px 0 2px;border-top:1px dashed var(--line);margin-top:8px}
.lastload b{color:var(--gold-mid);font-weight:600}
.exnote{font-size:13px;color:var(--txt-2);background:var(--ink-2);border-radius:8px;padding:10px 12px;margin-top:10px}

/* ---- rest timer ---- */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;
  display:none;align-items:center;gap:14px;padding:12px 18px;border-radius:99px;
  background:rgba(18,16,10,.96);border:1px solid var(--gold-deep);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
#rest.on{display:flex}
#rest .t{font-family:var(--disp);font-size:26px;font-weight:600;color:var(--gold-hi);line-height:1;min-width:66px;text-align:center}
#rest .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}

/* ---- chat ---- */
.chat-wrap{display:flex;gap:14px;height:calc(100vh - 210px);min-height:420px}
.chat-list{width:262px;flex:none;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surf);overflow:auto}
.chat-item{display:flex;gap:11px;align-items:center;padding:12px 13px;width:100%;text-align:left;border-bottom:1px solid var(--line-soft)}
.chat-item.on{background:rgba(217,169,60,.09)}
.chat-item>span:nth-child(2){flex:1;min-width:0;overflow:hidden}
.chat-item .nm{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .pv{display:block;font-size:12.5px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chat-main{flex:1;display:flex;flex-direction:column;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surf);min-width:0}
.chat-head{flex:none;display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line-soft)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:74%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.msg.them{align-self:flex-start;background:var(--surf-2);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(150deg,#3A2D10,#2A2009);border:1px solid var(--gold-deep);border-bottom-right-radius:4px}
.msg .ts{display:block;font-size:10.5px;color:var(--txt-3);margin-top:4px}
.chat-in{flex:none;display:flex;gap:9px;padding:11px;border-top:1px solid var(--line-soft)}
.chat-in input{flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14.5px}
.chat-in input:focus{border-color:var(--gold-deep);outline:none}

/* ---- food / nutrition ---- */
.macro{display:flex;gap:10px;flex-wrap:wrap}
.macro .m{flex:1;min-width:78px;background:var(--ink-2);border-radius:10px;padding:10px 12px;border:1px solid var(--line-soft)}
.macro .m .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.macro .m .v{font-family:var(--disp);font-size:20px;font-weight:600;margin-top:2px}
.meal{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surf);margin-bottom:11px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--ink-2)}
.meal-h h4{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.meal-h .kc{margin-left:auto;font-size:12.5px;color:var(--gold-mid);font-variant-numeric:tabular-nums}
.dfood{display:grid;grid-template-columns:minmax(150px,2.2fr) repeat(2,minmax(70px,.9fr)) repeat(4,minmax(62px,.8fr)) auto;gap:8px;align-items:end;padding:10px 15px;border-top:1px solid var(--line-soft)}
.dl{display:flex;flex-direction:column;gap:3px;min-width:0}.dl>span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}
.dfood .fi,.dmeal .meal-h .fi{padding:8px 9px;font-size:14px}.dfood .ddel{margin-bottom:2px}
.dmeal .dmn{flex:1;min-width:140px;font-family:var(--disp);letter-spacing:.06em}.dmeal .dmh{width:84px;flex:none}
@media (max-width:760px){.dfood{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 8px;padding:12px}.dfood .dn{grid-column:1/3;grid-row:1}.dfood .ddel{grid-column:3;grid-row:1;justify-self:end;align-self:end}.dmeal .meal-h{padding:10px 12px}.dmeal .dmn{min-width:0;flex:1 1 100%}.dmeal .dmh{width:90px}}
.food{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--line-soft);font-size:14px}
.food .g{margin-left:auto;color:var(--txt-2);font-size:13px;font-variant-numeric:tabular-nums;flex:none}

/* ---- builder ---- */
.lib{display:flex;flex-wrap:wrap;gap:7px}
.libx{font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--ink-2);color:var(--txt-2)}
.libx:hover{border-color:var(--gold-deep);color:var(--gold-hi)}
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.day-tab{font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border-radius:99px;
  border:1px solid var(--line);background:var(--surf);color:var(--txt-2);white-space:nowrap;flex:none}
.day-tab.on{background:linear-gradient(150deg,var(--gold-mid),#B98A22);border-color:#B98A22;color:#150F04;font-weight:600}

/* ---- photos ---- */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:11px}
.ph{aspect-ratio:3/4;border-radius:11px;border:1px solid var(--line-soft);overflow:hidden;position:relative;
  background:linear-gradient(170deg,#232329,#141418);display:grid;place-items:center}
.ph span{position:absolute;left:8px;bottom:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(8,8,10,.8);padding:3px 8px;border-radius:99px;color:var(--txt-2)}
.ph svg{opacity:.22}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft);margin-bottom:18px;overflow-x:auto}
.tab{font-family:var(--disp);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;padding:10px 14px;
  color:var(--txt-3);border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.tab.on{color:var(--gold-hi);border-bottom-color:var(--gold)}

/* ---- bottom nav (mobile / client) ---- */
.tabbar{display:none;flex:none;border-top:1px solid var(--line-soft);background:rgba(11,11,13,.97);backdrop-filter:blur(10px);
  padding:7px 6px;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));z-index:30;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:1 0 auto;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;color:var(--txt-3);
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--disp);position:relative}
.tabbar button.on{color:var(--gold-hi)}
.tabbar .bdg{position:absolute;top:1px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--crit);
  color:#fff;font-size:10px;display:grid;place-items:center;font-family:var(--sans);font-weight:600}
body.client .rail{display:none}
body.client .tabbar{display:flex}
body.client .wrap{padding:18px 16px 30px}

@media (max-width:860px){
  .rail{display:none}
  .tabbar{display:flex}
  .wrap{padding:18px 16px 30px}
  .chat-wrap{height:auto;flex-direction:column}
  .chat-list{width:100%;max-height:200px}
  .chat-main{min-height:420px}
}
.hint{font-size:12px;color:var(--txt-3);margin-top:8px;line-height:1.45}
.demo-tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.sep{height:1px;background:var(--line-soft);margin:16px 0}
.stack{display:flex;flex-direction:column;gap:11px}
.inline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(18px);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--surf-2);border:1px solid var(--gold-deep);color:var(--gold-hi);padding:11px 20px;border-radius:99px;
  font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:.28s;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* =================== v2 — aree, prenotazioni, IA, contabilità =================== */
.areabar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line-soft);background:#0B0B0D}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--ink-2);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{font-family:var(--disp);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:99px;color:var(--txt-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.seg button.on{background:linear-gradient(150deg,var(--gold-mid),#B98A22);color:#150F04;font-weight:600}
.seg.sm button{padding:5px 11px;font-size:10.5px}
.previewbar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#2A2210;color:var(--gold-hi);font-size:13px;border-bottom:1px solid var(--gold-deep)}
.previewbar .btn{margin-left:auto}

/* auth form */
.auth-form{display:grid;gap:10px;margin-top:26px;text-align:left}
.auth-err{color:#E8807A;font-size:13px;min-height:18px;text-align:center}
.linkbtn{color:var(--gold-mid);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* modale */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,5,6,.74);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-card{width:min(100%,660px);max-height:92vh;overflow:auto;background:var(--surf);border:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.modal-card h3{font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.modal-x{float:right}
@media (min-width:720px){.modal{align-items:center;padding:24px}.modal-card{border-radius:18px;padding:22px 24px}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field>label,.flabel{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt-3);font-family:var(--disp)}
.fi{background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;width:100%;min-width:0}
.fi:focus{border-color:var(--gold-deep);outline:none}
select.fi{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.fi{min-height:84px;resize:vertical;line-height:1.45}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:99px;background:var(--ink-2);color:var(--txt-2);cursor:pointer;user-select:none}
.chk.on{border-color:var(--gold-deep);color:var(--gold-hi);background:rgba(217,169,60,.1)}
.chk.no{border-color:#7A2B28;color:#E8807A;background:rgba(206,75,69,.1);text-decoration:line-through}
input[type=range]{accent-color:var(--gold);width:100%}
.switch{width:42px;height:24px;border-radius:99px;background:var(--surf-3);position:relative;flex:none;transition:.2s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--txt-3);transition:.2s}
.switch.on{background:rgba(79,168,106,.3);border-color:#3D7F54}
.switch.on::after{left:20px;background:#7BCB92}
.switch.locked{opacity:.55;cursor:not-allowed}

/* agenda / prenotazioni */
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surf);margin-bottom:9px;flex-wrap:wrap}
.slot .h{font-family:var(--disp);font-size:19px;font-weight:500;color:var(--gold-mid);width:56px;flex:none;font-variant-numeric:tabular-nums}
.slot .inf{flex:1;min-width:150px}
.slot .inf b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.slot .inf small{display:block;color:var(--txt-3);font-size:12.5px;line-height:1.35;margin-top:2px}
.slot.full .h{color:var(--txt-3)}
.slot.mine{border-color:var(--gold-deep);background:linear-gradient(160deg,#211B0E,var(--surf))}
.slot.closed{opacity:.55}
.slot.past{opacity:.5}
.slot .act{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.slot-more{flex-basis:100%;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.cap{display:flex;align-items:center;gap:5px}
.cap .n{font-family:var(--disp);font-size:16px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.cap .icon-btn{width:32px;height:32px}
.seats{display:flex;gap:3px;flex-wrap:wrap;max-width:140px}
.seats i{width:10px;height:10px;border-radius:3px;background:var(--surf-3)}
.seats i.on{background:var(--gold-mid)}
.pill.info{background:rgba(92,139,196,.16);color:#8FB3E0}
.pill.vio{background:rgba(164,120,200,.16);color:#C9A6E6}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--ink-2);border:1px solid var(--line-soft);border-radius:99px;padding:4px 6px 4px 10px}
.who button{color:var(--txt-3);display:grid;place-items:center}
.who button:hover{color:#E8807A}
.daybtn{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.daybtn small{font-family:var(--sans);font-size:10px;letter-spacing:.04em;opacity:.8;text-transform:none}

/* media esercizi */
.exthumb{aspect-ratio:4/3;border-radius:11px;background:linear-gradient(160deg,#25252B,#141418);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--gold-deep);border:1px solid var(--line-soft)}
.exthumb img{width:100%;height:100%;object-fit:cover;display:block}
.exthumb .ph-l{position:absolute;left:8px;bottom:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:rgba(8,8,10,.8);padding:3px 8px;border-radius:99px;color:var(--txt-2)}
.exthumb .vb{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(8,8,10,.8);color:var(--gold-hi)}
.excard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:10px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line-soft);transition:.18s}
.excard:hover{border-color:var(--gold-deep)}
.excard b{font-size:14px;line-height:1.25}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.ex-h .thumb{overflow:hidden}
.media{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:4px 0 12px}
.media img,.media video,.media iframe{width:100%;aspect-ratio:16/10;border-radius:10px;border:1px solid var(--line-soft);background:#000;object-fit:cover;display:block}
.media .empty{aspect-ratio:16/10;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--txt-3);font-size:13px;text-align:center;padding:10px}
.mini{width:40px;height:40px;border-radius:9px;overflow:hidden;flex:none;background:var(--surf-3);display:grid;place-items:center;color:var(--gold-mid)}
.mini img{width:100%;height:100%;object-fit:cover}


/* guida a passaggi */
#tour{position:fixed;inset:0;z-index:95;display:none}
#tour.on{display:block}
#tour .tv{position:fixed;inset:0;background:rgba(5,5,6,.74);opacity:0;transition:opacity .25s}
#tour.center .tv{opacity:1}
#tour .ts{position:fixed;border-radius:12px;box-shadow:0 0 0 2px var(--gold),0 0 0 9999px rgba(5,5,6,.74);transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease;pointer-events:none}
#tour.center .ts{opacity:0}
#tour .tc{position:fixed;width:min(350px,calc(100vw - 24px));background:linear-gradient(170deg,#211C10,var(--surf) 55%);border:1px solid var(--gold-deep);border-radius:16px;
  padding:16px 16px 14px;box-shadow:var(--shadow);transition:left .3s ease,top .3s ease;animation:tcIn .3s ease}
#tour .tc::after{content:"";position:absolute;left:calc(var(--ax,50%) - 7px);top:-7px;width:12px;height:12px;background:#211C10;border-left:1px solid var(--gold-deep);border-top:1px solid var(--gold-deep);transform:rotate(45deg)}
#tour .tc.up::after{top:auto;bottom:-7px;background:var(--surf);border:none;border-right:1px solid var(--gold-deep);border-bottom:1px solid var(--gold-deep)}
#tour.center .tc::after{display:none}
#tour.center .tc{text-align:center}
@keyframes tcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tc-ic{width:52px;height:52px;border-radius:50%;margin:2px auto 10px;display:grid;place-items:center;color:#150F04;background:linear-gradient(150deg,var(--gold-mid),var(--gold-deep))}
.tc-step{font-family:var(--disp);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
#tour .tc h4{font-family:var(--disp);font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:3px 0 6px;color:var(--txt)}
#tour .tc p{margin:0;font-size:14.5px;line-height:1.5;color:var(--txt-2)}
.tc-dots{display:flex;gap:5px;margin:14px 0 12px}
#tour.center .tc-dots{justify-content:center}
.tc-dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:all .25s}
.tc-dots i.ok{background:var(--gold-deep)}.tc-dots i.on{width:18px;background:var(--gold)}
.tc-b{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){#tour .ts,#tour .tc{transition:none;animation:none}}
/* listino */
.price{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--gold-hi);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--txt-3);display:block;letter-spacing:0}
.pin{width:84px;text-align:right}
.ben{margin:0;padding-left:17px;font-size:13.5px;color:var(--txt-2);line-height:1.45}
.ben li{margin:3px 0}
.ben li::marker{color:var(--gold)}
.tname{display:flex;gap:11px;align-items:flex-start;min-width:190px}

.act .ph{display:block;aspect-ratio:16/10;background:var(--surf-2);overflow:hidden}
.act .ph img{width:100%;height:100%;object-fit:cover;display:block}

.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:14px}
.dbtn{display:flex;flex-direction:column;align-items:center;padding:9px 2px;border-radius:12px;border:1px solid var(--line-soft);background:var(--ink-2);color:var(--txt-2)}

.dbtn:not(.off):hover{border-color:var(--gold-deep)}

.dbtn.off{opacity:.4;cursor:not-allowed}.dbtn.off em{color:var(--txt-3)}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:14px}
.hbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:11px 13px;border-radius:12px;border:1px solid var(--line-soft);background:var(--ink-2);color:var(--txt);text-align:left}

.wiz-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft)}

/* SHA-256 (sincrono, per non salvare mai le password in chiaro) */
function sha256(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  const mp=Math.pow,mw=mp(2,32);let i,j,res="";const words=[],bl=ascii.length*8;

  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return"";words[i>>2]|=j<<((3-i)%4)*8}

  for(j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];

  return res;
}

function temaCorso(c){
  if(c.tema&&TEMI[c.tema])return c.tema;
  const chk=t=>{t=(t||"").toLowerCase();
    if(/over ?[78]|dolce|terza et|anzian/.test(t))return "dolce";
    if(/senior|over ?[56]/.test(t))return "senior";
    if(/postur|mobilit|pilates|stretch|schiena sana|allungament/.test(t))return "postura";
    if(/tabata|hiit|interval/.test(t))return "tabata";
    if(/circuit/.test(t))return "circuit";
    if(/function|funzional|cross/.test(t))return "functional";
    if(/total ?body|full ?body|tonific/.test(t))return "totalbody";
    if(/boot/.test(t))return "bootcamp";
    return null};
  return chk(c.n)||chk(c.focus)||({stazioni:"circuit",tabata:"tabata",circuito:"totalbody",flusso:"postura"})[c.formato]||"totalbody";
}
/* legge il "Focus del corso" scritto da Kone */
function focusInfo(c){
  const t=(c.focus||"").toLowerCase(),F={p:new Set(),noImp:false,soloCL:false,zone:[],letto:[]};
  const add=(re,ps,lab)=>{if(re.test(t)){ps.forEach(x=>F.p.add(x));F.letto.push(lab)}};
  add(/equilibri|cadut|stabilit/,["equilibrio"],"equilibrio");
  add(/glute/,["hinge","lunge"],"glutei");
  add(/gamb|cosce/,["squat","lunge"],"gambe");
  add(/braccia|spalle|parte alta/,["push","pull"],"parte alta");
  add(/core|addom|pancia/,["core"],"core");
  add(/cardio|fiato|resistenz|brucia|dimagr/,["cardio"],"fiato");
  add(/schiena|postur|lombar|dorsal/,["pull","core"],"schiena");
  add(/mobilit|flessibil|allung|articol/,["mobilita"],"mobilità");
  add(/forza|potenz/,["squat","hinge","push","pull"],"forza");
  add(/trasport|presa|carry/,["carry"],"trasporti");
  if(/(senza|niente|no|evita\w*) (i )?salt|basso impatto/.test(t)){F.noImp=true;F.letto.push("niente salti")}
  if(/senza attrezzi|solo corpo libero/.test(t)){F.soloCL=true;F.letto.push("senza attrezzi")}
  ZONE.forEach(z=>{if(new RegExp("(proteg|attenzion|evita|niente|senza|dolor|male)[^.,;]{0,25}"+z).test(t)){F.zone.push(z);F.letto.push("proteggere "+z)}});
  return F;
}

async function pubblicaPrezzi(){
  const tok=pubTok();if(!tok){refreshPubBar();return}
  if(PUB.st==="busy"){PUB.again=true;return}
  PUB.st="busy";PUB.msg="";refreshPubBar();
  const cfg=pubCfg(),api="https://api.github.com/repos/"+cfg.repo+"/contents/"+PUB_FILE,
    H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const agg=DB.settings.prezziAgg||new Date().toISOString();
  try{
    for(let tent=0;tent<2;tent++){
      let sha;const g=await fetch(api+"?ref="+encodeURIComponent(cfg.branch)+"&t="+Date.now(),{headers:H,cache:"no-store"});
      if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error(g.status===401?"chiave di accesso non valida o scaduta":"GitHub risponde "+g.status);
      const body=Object.assign({agg:agg,nota:"File scritto dal pannello titolare: non modificarlo a mano."},prezziSnap());
      const content=btoa(unescape(encodeURIComponent(JSON.stringify(body,null,1))));
      const r=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify({message:"Listino aggiornato dal pannello titolare",content:content,sha:sha,branch:cfg.branch})});
      if(r.ok){if(DB.settings.prezziAgg===agg)DB.settings.prezziPend=false;DB.settings.prezziPub=new Date().toISOString();LS.set("db",DB);PUB.st="ok";break}
      if(r.status===409||r.status===422&&tent===0)continue;
      throw new Error(r.status===401?"chiave di accesso non valida o scaduta":r.status===403||r.status===404?"la chiave non ha il permesso di scrivere nel sito (Contents: Read and write)":"GitHub risponde "+r.status);
    }
    if(PUB.st==="busy")throw new Error("conflitto di versione, riprova");
  }catch(e){PUB.st="err";PUB.msg=e.message||"rete non disponibile"}
  refreshPubBar();
  if(PUB.again){PUB.again=false;if(DB.settings.prezziPend)pubblicaPrezzi()}
}
async function caricaPrezzi(){
  if(!/^https?:$/.test(location.protocol)||!DB)return;
  try{
    const r=await fetch("/"+PUB_FILE+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const j=await r.json();if(!j||!j.listino||!j.agg)return;
    if(j.agg<=(DB.settings.prezziAgg||""))return;
    if(DB.settings.prezziPend)return; /* modifiche del titolare non ancora pubblicate: vincono le sue */
    DB.listino=j.listino;
    if(Array.isArray(j.trattamenti)&&j.trattamenti.length){const old=DB.trattamenti;
      DB.trattamenti=j.trattamenti.map(t=>{const o=old.find(x=>x.id===t.id);if(o)Object.keys(o).forEach(k=>{if(t[k]===undefined&&typeof o[k]==="string"&&o[k].slice(0,5)==="data:")t[k]=o[k]});return t})}
    if(j.paypal)DB.settings.paypal=j.paypal;if(j.bonifico&&typeof j.bonifico==="object")DB.settings.bonifico=j.bonifico;if(typeof j.portale==="string")DB.settings.portale=j.portale;
    DB.settings.prezziAgg=j.agg;_pSig=prezziSig();LS.set("db",DB);
    if(el("app").classList.contains("show")&&!el("modal").classList.contains("on")&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render();
  }catch(e){}
}

function storicoCorso(cid,before){return Object.values(DB.programmi).filter(p=>p.corso===cid&&p.data<before).sort((a,b)=>a.data<b.data?1:-1)}
const fbDi=pid=>DB.feedback.filter(f=>f.pid===pid);

/* 1 — lettura di storico e feedback */
function analisi(c,data){
  const st=storicoCorso(c.id,data).slice(0,3);
  const A={intensita:c.intensita,why:[],zone:[],recenti:[],evita:[],last:st[0]||null,rpe:null,voto:null,nfb:0};
  if(!st.length){A.why.push("Prima seduta del corso: si parte dall'intensità impostata ("+c.intensita+"/10).");return A}
  const lastI=st[0].intensita;A.intensita=lastI;
  const fbs=st.flatMap(p=>fbDi(p.id));A.nfb=fbs.length;
  if(fbs.length>=3){
    A.rpe=avg(fbs.map(f=>f.rpe));A.voto=avg(fbs.map(f=>f.voto));
    if(A.rpe>c.intensita+1){A.intensita=lastI-1;A.why.push("Fatica percepita media "+fmtN(A.rpe)+"/10 nelle ultime "+st.length+" sedute, sopra l'obiettivo di "+c.intensita+": intensità abbassata a "+A.intensita+"/10.")}
    else if(A.rpe<c.intensita-1.2){A.intensita=lastI+1;A.why.push("Fatica percepita media "+fmtN(A.rpe)+"/10, sotto l'obiettivo di "+c.intensita+": si sale di un gradino ("+A.intensita+"/10).")}
    else A.why.push("Fatica percepita in linea con l'obiettivo di "+c.intensita+" ("+fmtN(A.rpe)+"/10 su "+fbs.length+" feedback): intensità confermata a "+lastI+"/10.");
    if(A.voto<3.4){st.slice(0,2).forEach(p=>p.blocchi.forEach(b=>{if(b.fase==="main")b.esercizi.forEach(e=>A.evita.push(e.n))}));
      A.why.push("Gradimento medio "+fmtN(A.voto)+"/5: gli esercizi delle ultime due sedute vengono sostituiti per dare più varietà.")}
  } else A.why.push("Pochi feedback raccolti ("+fbs.length+"): si mantiene l'intensità della seduta precedente.");
  const z={};st.slice(0,2).flatMap(p=>fbDi(p.id)).filter(f=>f.dolore&&ZONE.includes(f.dolore)).forEach(f=>z[f.dolore]=(z[f.dolore]||0)+1);
  Object.keys(z).forEach(k=>{A.zone.push(k);A.why.push(z[k]+(z[k]>1?" partecipanti hanno":" partecipante ha")+" segnalato fastidio a "+k+": esclusi gli esercizi che caricano quella zona.")});
  st[0].blocchi.forEach(b=>{if(b.fase==="main"||b.fase==="finisher")b.esercizi.forEach(e=>A.recenti.push(e.n))});
  return A;
}
function scegli(r,list,patterns,count,I,avoid,bonus,used){
  used=used||new Set();list=list.filter(e=>!used.has(e.n));
  const sc=new Map(list.map(e=>[e.n,(avoid.has(e.n)?4:0)+Math.abs(e.int-I)*.35+r()+(bonus?bonus(e):0)]));
  const by=(a,b)=>sc.get(a.n)-sc.get(b.n);const out=[];
  for(const pat of patterns){if(out.length>=count)break;const c=list.filter(e=>e.p===pat&&!used.has(e.n)).sort(by)[0];if(c){out.push(c);used.add(c.n)}}
  list.filter(e=>!used.has(e.n)).sort(by).forEach(e=>{if(out.length<count){out.push(e);used.add(e.n)}});
  return out;
}

function verifica(p,c){
  const off=(DB.settings.regoleOff||[]).filter(id=>!(REGOLE.find(x=>x.id===id)||{}).lock);
  const zone=p.zone||[],last=storicoCorso(c.id,p.data)[0];
  const res={};const set=(id,stato,dett)=>{res[id]=off.includes(id)?{id,stato:"off",dett:"Regola disattivata dal coach"}:{id,stato,dett}};
  const ok=usabile(c,zone);
  const inUse=()=>new Set(p.blocchi.flatMap(b=>b.esercizi.map(e=>e.n)));
  const sost=(b,i)=>{const old=PM[b.esercizi[i].n],fase=b.fase==="warm"?"warm":b.fase==="cool"?"cool":(old&&old.f==="mob"?"mob":"main"),used=inUse();
    const cand=POOL.filter(e=>(e.f===fase||(fase==="mob"&&e.f==="warm"))&&ok(e)&&!used.has(e.n)&&(!c.consentiti.length||e.f!=="main"||c.consentiti.includes(e.n)));
    const s=(old&&cand.find(e=>e.p===old.p))||cand[0];const prev=b.esercizi[i].n;
    if(s){b.esercizi[i]={n:s.n,d:b.esercizi[i].d};return prev+" → "+s.n}b.esercizi.splice(i,1);return prev+" rimosso"};
  const sweep=(id,bad)=>{if(off.includes(id)){set(id,"off");return}const fx=[];
    p.blocchi.forEach(b=>{for(let i=b.esercizi.length-1;i>=0;i--){const e=PM[b.esercizi[i].n];if(bad(e,b.esercizi[i].n))fx.push(sost(b,i))}});
    set(id,fx.length?"fix":"ok",fx.length?"Corretto: "+fx.join(" · "):"")};
  sweep("attrezzi",(e)=>!e||!(e.a==="corpo libero"||c.attrezzi.includes(e.a)));
  sweep("vietati",(e,n)=>c.vietati.includes(n));
  sweep("livello",e=>e&&(e.liv>c.livello||(c.livello===1&&e.imp)));
  sweep("zone",e=>e&&e.z&&zone.includes(e.z));
  const mainB=p.blocchi.find(b=>b.fase==="main");
  if(off.includes("schemi"))set("schemi","off");
  else if(!mainB||(p.tema?p.formato==="flusso":c.formato==="flusso"))set("schemi","ok","Non richiesto per i corsi di mobilità e ginnastica dolce");
  else{const pats=new Set(p.blocchi.filter(b=>b.fase==="main").flatMap(b=>b.esercizi.map(e=>(PM[e.n]||{}).p)));const need=[["gambe",["squat","lunge","hinge"]],["spinta",["push"]],["tirata",["pull"]],["core",["core"]]];const added=[];
    need.forEach(nd=>{if(nd[1].some(x=>pats.has(x)))return;const used=inUse();const e=POOL.find(x=>x.f==="main"&&nd[1].includes(x.p)&&ok(x)&&!used.has(x.n));
      if(e){mainB.esercizi.push({n:e.n,d:mainB.esercizi.length?mainB.esercizi[mainB.esercizi.length-1].d.replace(/Stazione \d+/,"Stazione "+(mainB.esercizi.length+1)):"10 rip"});added.push(nd[0]+": "+e.n)}else added.push(nd[0]+": nessun esercizio disponibile")});
    set("schemi",added.length?(added.some(a=>a.includes("nessun"))?"ko":"fix"):"ok",added.length?"Aggiunto "+added.join(" · "):"")}
  if(off.includes("stazioni"))set("stazioni","off");
  else if(p.formato!=="stazioni"||!mainB)set("stazioni","ok","Non è un circuito a stazioni");
  else{const need=Math.ceil(p.partecipanti/2),addd=[];while(mainB.esercizi.length<need){const used=inUse();const e=POOL.find(x=>x.f==="main"&&ok(x)&&!used.has(x.n));if(!e)break;mainB.esercizi.push({n:e.n,d:"Stazione "+(mainB.esercizi.length+1)+" · "+e.a});addd.push(e.n)}
    set("stazioni",mainB.esercizi.length>=need?(addd.length?"fix":"ok"):"ko",addd.length?"Aggiunte "+addd.length+" stazioni per "+p.partecipanti+" partecipanti":mainB.esercizi.length+" stazioni per "+p.partecipanti+" partecipanti")}
  if(off.includes("varieta"))set("varieta","off");
  else if(!last||!mainB)set("varieta","ok","Nessuna seduta precedente da confrontare");
  else{const prev=new Set(last.blocchi.filter(b=>b.fase==="main").flatMap(b=>b.esercizi.map(e=>e.n)));
    const rep=mainB.esercizi.map((e,i)=>[e.n,i]).filter(x=>prev.has(x[0]));const maxRep=Math.floor(mainB.esercizi.length/2);const fx=[];
    for(let k=0;k<rep.length-maxRep;k++){const i=rep[k][1];const used=inUse();const old=PM[mainB.esercizi[i].n];
      const s=POOL.find(e=>e.f==="main"&&ok(e)&&!used.has(e.n)&&!prev.has(e.n)&&old&&e.p===old.p)||POOL.find(e=>e.f==="main"&&ok(e)&&!used.has(e.n)&&!prev.has(e.n));
      if(s){fx.push(mainB.esercizi[i].n+" → "+s.n);mainB.esercizi[i]={n:s.n,d:mainB.esercizi[i].d}}}
    set("varieta",fx.length?"fix":"ok",fx.length?"Sostituiti: "+fx.join(" · "):(mainB.esercizi.length-rep.length)+" esercizi su "+mainB.esercizi.length+" nuovi rispetto alla seduta precedente")}
  const W=p.blocchi.find(b=>b.fase==="warm"),Cd=p.blocchi.find(b=>b.fase==="cool");
  if(!W||W.min<8){if(W){const d=8-W.min;W.min=8;if(mainB)mainB.min-=d}else{p.blocchi.unshift({nome:"Riscaldamento",fase:"warm",min:8,esercizi:POOL.filter(e=>e.f==="warm").slice(0,3).map(e=>({n:e.n,d:"2′40″"}))});if(mainB)mainB.min-=8}set("warm","fix","Riscaldamento portato a 8′")}else set("warm","ok",W.min+"′ di riscaldamento");
  if(off.includes("cool"))set("cool","off");
  else if(!Cd||Cd.min<5){if(Cd){const d=5-Cd.min;Cd.min=5;if(mainB)mainB.min-=d}else{p.blocchi.push({nome:"Defaticamento",fase:"cool",min:5,esercizi:POOL.filter(e=>e.f==="cool").slice(0,3).map(e=>({n:e.n,d:"1′40″"}))});if(mainB)mainB.min-=5}set("cool","fix","Defaticamento portato a 5′")}else set("cool","ok",Cd.min+"′ di defaticamento");
  const tot=p.blocchi.reduce((a,b)=>a+(+b.min||0),0);
  if(off.includes("durata"))set("durata","off");
  else if(tot!==c.durata&&mainB){mainB.min+=c.durata-tot;set("durata","fix","Da "+tot+"′ a "+c.durata+"′ sistemando la parte centrale")}else set("durata",tot===c.durata?"ok":"ko",tot+"′ su "+c.durata+"′");
  const mx=LIV_MAX[c.livello];
  if(p.intensita>mx){set("intmax","fix","Da "+p.intensita+" a "+mx+"/10");p.intensita=mx}else set("intmax","ok",p.intensita+"/10 (tetto "+mx+")");
  if(off.includes("prog"))set("prog","off");
  else if(last&&Math.abs(p.intensita-last.intensita)>1){const n=clamp(p.intensita,last.intensita-1,last.intensita+1);set("prog","fix","Da "+p.intensita+" a "+n+"/10 (la seduta prima era "+last.intensita+")");p.intensita=n}
  else set("prog","ok",last?"Seduta precedente "+last.intensita+"/10 → oggi "+p.intensita+"/10":"Prima seduta");
  set("capienza",p.partecipanti<=DB.settings.maxCorso?"ok":"ko",p.partecipanti+" partecipanti su "+DB.settings.maxCorso+" ammessi");
  p.regole=REGOLE.map(x=>res[x.id]||{id:x.id,stato:"ok",dett:""});
  p.bloccato=p.regole.some(x=>x.stato==="ko");
  return p;
}
function autoProgrammi(){
  let n=0;
  Object.values(DB.agenda).filter(s=>s.tipo==="corso"&&s.d===T0).forEach(s=>{
    const id=s.d+"_"+s.corso,old=DB.programmi[id];if(old&&!(old.auto&&old.fonte==="Motore regole"))return;const c=corso(s.corso);if(!c)return;
    DB.programmi[id]=verifica(genera(c,s.d,s.pren.length),c);DB.programmi[id].auto=true;n++});
  if(n)save();return n;
}
/* IA vera: funzione Netlify che chiama Claude. Se non c'è, si resta sul motore a regole. */
async function generaConIA(c,data,part,variante){

  const body={corso:{nome:c.n,livello:LIVELLI[c.livello],obiettivo:c.obiettivo,durata:c.durata,intensita_obiettivo:c.intensita,formato:FORMATI[c.formato],attrezzi:c.attrezzi,vietati:c.vietati},

    analisi:A.why,esercizi_ammessi:POOL.filter(ok).map(e=>({nome:e.n,fase:e.f,schema:e.p,attrezzo:e.a})),
    regole:REGOLE.filter(x=>!(DB.settings.regoleOff||[]).includes(x.id)).map(x=>x.t+" — "+x.x)};
  const res=await fetch("/.netlify/functions/genera-programma",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok)throw new Error("backend "+res.status);
  const j=await res.json();const g=j.programma;if(!g||!Array.isArray(g.blocchi))throw new Error("risposta non valida");
  const p={id:data+"_"+c.id,corso:c.id,data,durata:c.durata,intensita:+g.intensita||c.intensita,partecipanti:part,formato:c.formato,
    blocchi:g.blocchi.map(b=>({nome:String(b.nome||""),fase:["warm","main","finisher","cool"].includes(b.fase)?b.fase:"main",min:+b.min||0,nota:b.nota||"",esercizi:(b.esercizi||[]).map(e=>({n:String(e.n||""),d:String(e.d||"")}))})),
    why:(g.motivazioni||[]).map(String),zone:A.zone,fonte:"IA · "+(j.modello||"Claude"),creato:Date.now(),stat:{rpe:A.rpe,voto:A.voto,nfb:A.nfb},ver:variante||0};
  return verifica(p,c);
}

/* ---------- grafici ---------- */
let CID=0;
function chartLine(series,opt){
  opt=opt||{};if(!series.length)return '<p class="muted">Ancora nessun dato.</p>';
  const W=600,H=opt.h||212,L=50,R=16,T=16,B=30,id="cg"+(++CID);
  const v=series.map(s=>s[1]);let mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);if(mn===mx){mn-=1;mx+=1}
  const sp=mx-mn,lo=mn-sp*.18,hi=mx+sp*.18;
  const X=i=>L+(W-L-R)*(series.length>1?i/(series.length-1):.5),Y=val=>T+(H-T-B)*(1-(val-lo)/(hi-lo));
  const fmt=n=>fmtN(n,opt.dec==null?1:opt.dec)+(opt.unit||"");
  const pts=series.map((s,i)=>X(i)+","+Y(s[1])).join(" ");
  const area="M"+X(0)+","+(H-B)+" L"+series.map((s,i)=>X(i)+","+Y(s[1])).join(" L")+" L"+X(series.length-1)+","+(H-B)+" Z";
  let g="";[mx,(mx+mn)/2,mn].forEach(t=>{g+='<line x1="'+L+'" y1="'+Y(t)+'" x2="'+(W-R)+'" y2="'+Y(t)+'" stroke="#2A2A31"/><text x="'+(L-9)+'" y="'+(Y(t)+4)+'" text-anchor="end" fill="#726C62" font-size="12" font-family="Barlow,sans-serif">'+fmt(t)+'</text>'});
  let xl="";[0,Math.floor((series.length-1)/2),series.length-1].filter((x,i,a)=>a.indexOf(x)===i).forEach(i=>{xl+='<text x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle" fill="#726C62" font-size="12" font-family="Barlow,sans-serif">'+esc(series[i][0])+'</text>'});
  const lx=X(series.length-1),ly=Y(series[series.length-1][1]);
  let s2="";if(opt.ref){const p2=opt.ref.map((y,i)=>X(i)+","+Y(y)).join(" ");s2='<polyline points="'+p2+'" fill="none" stroke="#5C8BC4" stroke-width="2" stroke-dasharray="5 5"/>'}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+(opt.label||"Grafico andamento")+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D9A93C" stop-opacity=".34"/><stop offset="100%" stop-color="#D9A93C" stop-opacity="0"/></linearGradient></defs>'+
   g+'<path d="'+area+'" fill="url(#'+id+')"/>'+s2+'<polyline points="'+pts+'" fill="none" stroke="#E8C463" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
   '<circle cx="'+lx+'" cy="'+ly+'" r="5" fill="#F7E3A1" stroke="#16161A" stroke-width="2.5"/>'+xl+'</svg>';
}
function chartBars(series,opt){
  opt=opt||{};const W=600,H=opt.h||200,L=56,R=14,T=16,B=30;
  const v=series.map(s=>s[1]);const top=Math.max(1,Math.max.apply(null,v)),mx=top*1.14,bw=(W-L-R)/series.length;
  const fmt=n=>opt.money?Math.round(n).toLocaleString("it-IT"):Math.round(n);
  let g="";[0,top/2,top].forEach(t=>{const y=T+(H-T-B)*(1-t/mx);g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#2A2A31"/><text x="'+(L-9)+'" y="'+(y+4)+'" text-anchor="end" fill="#726C62" font-size="12" font-family="Barlow,sans-serif">'+fmt(t)+'</text>'});
  let b="";series.forEach((s,i)=>{const h=(H-T-B)*(s[1]/mx),x=L+bw*i+bw*.22,y=H-B-h;const on=opt.hi!=null?i===opt.hi:i===series.length-1;
    b+='<rect x="'+x+'" y="'+y+'" width="'+(bw*.56)+'" height="'+Math.max(h,1)+'" rx="4" fill="'+(on?"#E8C463":"#4A4231")+'"/><text x="'+(L+bw*i+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" fill="#726C62" font-size="12" font-family="Barlow,sans-serif">'+s[0]+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafico a barre">'+g+b+'</svg>';
}
function spark(vals){if(vals.length<2)return "";const W=90,H=28,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),sp=mx-mn||1;
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><polyline fill="none" stroke="#E8C463" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+vals.map((v,i)=>(3+i*(W-6)/(vals.length-1))+","+(H-4-(v-mn)/sp*(H-8))).join(" ")+'"/></svg>'}

function registraCliente(e){e.preventDefault();
  const cap=x=>x.toLowerCase().replace(/(^|[\s'-])\S/g,m=>m.toUpperCase());
  const no=cap(el("rgN").value.trim()),co=cap(el("rgC").value.trim()),em=el("rgE").value.trim().toLowerCase(),tel=el("rgT").value.trim(),pw=el("rgP").value,pw2=el("rgP2").value;
  const ko=m=>errShake("rgErr","regForm",m);
  if(!no||!co)return ko("Scrivi nome e cognome");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return ko("Email non valida");
  if(tel.replace(/\D/g,"").length<8)return ko("Numero di telefono non valido");
  if(pw.length<6)return ko("La password deve avere almeno 6 caratteri");
  if(pw!==pw2)return ko("Le due password non coincidono");
  if(!el("rgOk").checked)return ko("Serve il consenso al trattamento dei dati");
  if(DB.clienti.some(c=>(c.email||"").toLowerCase()===em))return ko("Esiste già un account con questa email: accedi");
  const id=Math.max.apply(null,DB.clienti.map(c=>c.id).concat([0]))+1,n=no+" "+co;
  DB.clienti.push({id,n,i:(no[0]+co[0]).toUpperCase(),email:em,pw:hashPw(pw),tel,piano:"Nessun abbonamento",tipo:"none",usate:0,tot:0,extra:"—",scad:"—",gg:0,peso:null,start:null,ader:100,
    note:"Registrato dall'app il "+fmtD(T0,{day:"numeric",month:"long",year:"numeric"})+".",reg:T0,privacy:new Date().toISOString()});
  msgAKone(id,"Ciao Kone, mi sono appena registrato nell'app. Email: "+em+" · Telefono: "+tel+".");
  save();["rgN","rgC","rgE","rgT","rgP","rgP2"].forEach(x=>el(x).value="");el("rgOk").checked=false;
  LS.set("sess",{role:"client",cid:id});enterApp("client",id);toast("Benvenuto "+no+"! Il tuo account è pronto")}

  d.pasti.forEach((p,i)=>{const e=el("dM_"+i);if(e)e.textContent=fN(dSomma(p.f).k)+" kcal";
    p.f.forEach((f,j)=>{const x=el("dF_"+i+"_"+j);if(x)x.placeholder=dK(f)?String(dK(f)):"auto"})});
  const b=el("dBar");if(b){const pc=d.tgt?Math.min(100,Math.round(t.k/d.tgt*100)):0;b.style.width=pc+"%"}}

  if(n>mx)return toast("Massimo "+mx+" posti per "+tipoLabel(s.tipo)+" · si cambia in “Capienza massima”");
  s.cap=n;save();render()}
function togliPren(id,i){const s=DB.agenda[id];const b=s.pren.splice(i,1)[0];save();toast(b.nome+" tolto da "+s.h);render()}
function aggiungiPren(id){const s=DB.agenda[id],v=el("add_"+id.replace(/[^\w]/g,"")).value;if(!v)return;

const scAtt=r=>!!(r&&r.sc>0&&(!r.scFino||r.scFino>=T0));
const pEff=(r,k)=>{if(!r)return 0;const v=r[k||"p"]||0;return scAtt(r)?Math.round(v*(100-r.sc))/100:v};
function objAt(path){const p=path.split(".");let o=DB;for(let i=0;i<p.length;i++){if(o==null)return null;o=o[p[i]]}return o}
function priceTxt(r,k){return scAtt(r)?'<span class="pold">'+eur(r[k||"p"])+'</span>'+eur(pEff(r,k)):eur(pEff(r,k))}
function priceCell(path,v,label){const p=path.split("."),k=p.pop(),r=objAt(p.join("."));
  if(S.role==="coach")return '<input class="inp pin" inputmode="decimal" value="'+v+'" onchange="setPrezzo(\''+path+'\',this.value)" aria-label="'+esc(label)+'"> €'+(scAtt(r)?'<span class="scx">scontato '+eur(pEff(r,k))+'</span>':'');
  return '<span class="price">'+priceTxt(r,k)+'</span>'+(scAtt(r)?' <span class="pill sc">−'+r.sc+'%</span>':'')}
function setPrezzo(path,v){const n=num(v);if(n==null||n<0)return toast("Prezzo non valido");const p=path.split(".");let o=DB;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=n;save();render();toast(pubTok()?"Prezzo salvato · lo pubblico per tutti i clienti":"Prezzo salvato su questo dispositivo")}
function setCampo(path,v,t){const p=path.split("."),k=p.pop(),o=objAt(p.join("."));if(!o)return;
  if(t==="n"){const n=parseInt(v);if(isNaN(n)||n<0)return toast("Numero non valido");o[k]=n;save();render();toast(n?"Sedute aggiornate":"Impostato: illimitati");return}
  v=String(v).trim();if(k==="n"&&!v)return toast("Il nome non può essere vuoto"),render();o[k]=v;save();toast("Salvato")}

     (c.det?'<td data-l="'+(c.sed?"Dettaglio":"Contenuto")+'" class="muted">'+(coach?tin(b+".d",r.d||"","dt","Dettaglio"):esc(r.d||""))+'</td>':'')+

     (coach?'<td class="tools"><div class="tl-b">'+(c.risp?'<button class="btn sm ghost" onclick="rispModal(\''+key+'\','+i+')" title="Risparmio mostrato al cliente">risparmi '+eur(r.r||0)+'</button> ':'')+
       (isMeseVoce(key,r)?'<button class="btn sm ghost'+(r.link?" sc-on":"")+'" onclick="linkModal(\''+key+'\','+i+')" title="Link di pagamento ricorrente">'+ic("refresh",12)+(r.link?' addebito ✓':' addebito auto')+'</button> ':'')+'<button class="btn sm ghost'+(scAtt(r)?" sc-on":"")+'" onclick="scontoModal(\''+b+'\')">'+(r.sc>0?"−"+r.sc+"%"+(scAtt(r)?"":" scaduto"):"% sconto")+'</button> '+
       '<button class="icon-btn" onclick="eliminaVoce(\''+key+'\','+i+')" aria-label="Elimina voce">'+ic("trash",15)+'</button></div></td>'

  const g=DB.scheda.giorni[dayIdx()],H=DB.carichi[S.cid]||(DB.carichi[S.cid]={});let n=0;

const toHM=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const capFirst=t=>t.charAt(0).toUpperCase()+t.slice(1);
function calDate(){return S.cdate||T0}

/* ---------- vista settimana con trascinamento ---------- */
const WPX=54;
function calWeek(wk){
  const all=wk.map(x=>calSlots(x));let mn=8,mx=20;
  all.forEach(l=>l.forEach(s=>{const m=toMin(s.h);mn=Math.min(mn,Math.floor(m/60));mx=Math.max(mx,Math.ceil((m+s.dur)/60))}));
  const H=(mx-mn)*WPX;let hrs="";for(let h=mn;h<mx;h++)hrs+='<span style="top:'+(h-mn)*WPX+'px">'+pad(h)+':00</span>';
  return '<div class="wk-wrap"><div class="wk" style="--hpx:'+WPX+'px">'+
   '<div class="wk-h"><span></span>'+wk.map(x=>{const dt=fromIso(x);return '<button class="'+(x===T0?"today":"")+'" onclick="S.cv=\'giorno\';calDay(\''+x+'\')">'+dt.toLocaleDateString("it-IT",{weekday:"short"}).replace(".","")+' <b>'+dt.getDate()+'</b></button>'}).join("")+'</div>'+
   '<div class="wk-b"><div class="wk-hrs" style="height:'+H+'px">'+hrs+'</div>'+
   wk.map((x,j)=>'<div class="wk-col'+(x<T0?" past":"")+(x===T0?" today":"")+'" style="height:'+H+'px" data-d="'+x+'" data-h0="'+mn+'" ondragover="calOver(event)" ondragleave="this.classList.remove(\'drop\')" ondrop="calDrop(event)" ondblclick="calDbl(event)">'+
     all[j].map(s=>{const top=(toMin(s.h)-mn*60)/60*WPX,ht=Math.max(24,s.dur/60*WPX-3),past=isPast(s),full=s.pren.length>=s.cap;
      return '<button class="wev'+(past?" past":"")+(full?" full":"")+(s.chiuso?" closed":"")+'" style="--c:'+colSlot(s)+';top:'+top+'px;height:'+ht+'px" '+(past?'':'draggable="true" ondragstart="calDrag(event,\''+s.id+'\')" ondragend="calEnd()"')+' onclick="calAzioni(\''+s.id+'\')" title="'+esc(slotTitle(s))+' · '+s.h+'"><b>'+esc(slotTitle(s))+'</b><small>'+s.h+' · '+s.pren.length+'/'+s.cap+'</small></button>'}).join("")+
   '</div>').join("")+'</div></div></div>';
}
let DRAG=null;
function calDrag(e,id){DRAG={id,off:e.offsetY||0};try{e.dataTransfer.setData("text/plain",id);e.dataTransfer.effectAllowed="move"}catch(x){}e.currentTarget.classList.add("drag")}
function calEnd(){document.querySelectorAll(".wk-col.drop").forEach(c=>c.classList.remove("drop"));document.querySelectorAll(".wev.drag").forEach(c=>c.classList.remove("drag"))}
function calOver(e){if(!DRAG)return;e.preventDefault();e.currentTarget.classList.add("drop")}
function calY(e,off){const c=e.currentTarget,r=c.getBoundingClientRect(),y=e.clientY-r.top-(off||0);
  return clamp(Math.round((+c.dataset.h0*60+y/WPX*60)/15)*15,0,23*60+45)}
function calDrop(e){e.preventDefault();const c=e.currentTarget;c.classList.remove("drop");if(!DRAG)return;
  const m=calY(e,DRAG.off),id=DRAG.id;DRAG=null;moveSlot(id,c.dataset.d,toHM(m))}
function calDbl(e){if(e.target!==e.currentTarget)return;const d=e.currentTarget.dataset.d;if(d<T0)return;nuovoSlot(d,toHM(calY(e,0)))}

  if(tipo!=="none"&&(isNaN(tot)||tot<0))return toast("Sedute non valide");

let TR=null;
function tourStart(){
  if(S.role!=="client")return;closeModal();
  if(S.area!=="allen")setArea("allen");
  TR={i:0,view:S.view};el("tour").classList.add("on");document.addEventListener("keydown",tourKey);addEventListener("resize",tourPos);tourShow();
}
function tourEnd(fatto){
  if(!TR)return;const v=TR.view;TR=null;
  el("tour").classList.remove("on");document.removeEventListener("keydown",tourKey);removeEventListener("resize",tourPos);
  if(!S.preview)LS.set("tour_"+S.cid,1);
  if(fatto!==false&&S.view!=="oggi")go("oggi");
}
function tourKey(e){if(!TR)return;if(e.key==="Escape")tourEnd();else if(e.key==="ArrowRight")tourNext(1);else if(e.key==="ArrowLeft")tourNext(-1)}
function tourNext(d){if(!TR)return;const n=TR.i+d;if(n<0)return;if(n>=TOUR.length)return tourEnd();TR.i=n;tourShow()}
function tourTarget(st){return st.c?null:st.sel?st.sel():tabBtn(st.go)}
function tourShow(){
  const st=TOUR[TR.i],n=TOUR.length;
  if(st.go&&S.view!==st.go)go(st.go);
  const nome=esc((me().n||"").split(" ")[0]);
  el("tourC").innerHTML=(st.c?'<div class="tc-ic">'+ic(st.ic||"spark",26)+'</div>':'')+
   '<div class="tc-step">'+(TR.i&&TR.i<n-1?'Passo '+TR.i+' di '+(n-2):TR.i?'Fine':'Guida all\'app')+'</div>'+
   '<h4 id="tourT">'+esc(st.t)+'</h4><p>'+st.d(nome)+'</p>'+
   '<div class="tc-dots">'+TOUR.map((x,i)=>'<i class="'+(i===TR.i?"on":i<TR.i?"ok":"")+'"></i>').join("")+'</div>'+
   '<div class="tc-b">'+(st.fine?'':'<button class="linkbtn" onclick="tourEnd()">Salta la guida</button>')+'<span style="flex:1"></span>'+
   (TR.i&&!st.fine?'<button class="btn sm ghost" onclick="tourNext(-1)">Indietro</button>':'')+
   (st.fine&&typeof installApp==="function"&&!(matchMedia("(display-mode: standalone)").matches||navigator.standalone)?'<button class="btn sm" onclick="tourEnd();installApp()">Installa l\'app</button>':'')+
   '<button class="btn sm primary" id="tourGo" onclick="tourNext(1)">'+(TR.i===0?"Iniziamo":st.fine?"Inizia ad allenarti":"Avanti")+'</button></div>';
  const t=tourTarget(st);
  if(t&&t.scrollIntoView)try{t.scrollIntoView({block:"nearest",inline:"center"})}catch(e){}
  tourPos();setTimeout(tourPos,260);
  setTimeout(()=>{const b=el("tourGo");if(b&&TR)b.focus({preventScroll:true})},60);
}
function tourPos(){
  if(!TR)return;const st=TOUR[TR.i],T=el("tour"),sp=T.querySelector(".ts"),c=el("tourC"),t=tourTarget(st);
  const W=innerWidth,H=innerHeight,cw=c.offsetWidth,ch=c.offsetHeight;
  const r=t&&t.offsetParent!==null?t.getBoundingClientRect():null;
  T.classList.toggle("center",!r);
  if(!r){c.style.left=Math.max(12,(W-cw)/2)+"px";c.style.top=Math.max(12,(H-ch)/2)+"px";return}
  const pad=6;sp.style.left=(r.left-pad)+"px";sp.style.top=(r.top-pad)+"px";sp.style.width=(r.width+pad*2)+"px";sp.style.height=(r.height+pad*2)+"px";
  let left=r.left+r.width/2-cw/2;left=Math.max(12,Math.min(W-cw-12,left));
  let top=r.top>H/2?r.top-pad-14-ch:r.bottom+pad+14;top=Math.max(12,Math.min(H-ch-12,top));
  c.style.left=left+"px";c.style.top=top+"px";
  const ax=Math.max(18,Math.min(cw-18,r.left+r.width/2-left));c.style.setProperty("--ax",ax+"px");c.classList.toggle("up",r.top>H/2);
}

function migraV8(){
  const st=DB.settings;
  if(!st.corsi29){(DB.listino.corsi||[]).forEach(r=>{if(r.sed===1&&r.p===12)r.p=PREZZO_CORSO});st.corsi29=true}
  if(!st.exFx1){DB.esercizi.forEach(x=>{const k=FX_FOTO[x.n];if(k&&!x.foto){x.foto="/assets/img/esercizi/"+k+"-a.webp";x.foto2="/assets/img/esercizi/"+k+"-b.webp"}});st.exFx1=true}
  if(!st.exGrp1){const G={"Mani e avambracci":"Avambracci e presa","Mobilità":"Mobilità e stretching","Schiena":"Lombari","Funzionale":"Condizionamento","Total body":"Condizionamento","Braccia e spalle":"Spalle","Braccia":"Tricipiti"};DB.esercizi.forEach(x=>{if(G[x.m])x.m=G[x.m]});st.exGrp1=true}
  st.bonifico=st.bonifico||{iban:"",intest:"Kone Moctar",banca:""};
  if(st.portale==null)st.portale="";
  DB.corsiArch=DB.corsiArch||[];DB.agendaDel=DB.agendaDel||{};DB.diete=DB.diete||{};
  DB.corsi.forEach(c=>{if(!c.col)c.col=CORSO_COL[c.id]||null});
  rinnoviAuto(true);
}

  const caus=(wAtt()||{n:""}).n+" "+fmtD(s.d)+" "+s.h;
  return '<div class="card wdone"><span class="ok-ic">'+ic("check",30)+'</span><h2 class="wiz-t">Prenotato!</h2>'+
   '<p class="muted">'+esc(slotTitle(s,b))+' · '+capFirst(fmtD(s.d,{weekday:"long",day:"numeric",month:"long"}))+' alle '+s.h+'</p>'+
   (b.pay.m==="paypal"?paypalBox(b.pay.imp,caus):b.pay.m==="bonifico"?bonificoBox(b.pay.imp,caus):'<p style="margin-top:10px">'+(b.pay.m==="piano"?"Scalato dal tuo abbonamento: non devi pagare nulla. "+capFirst(rimTxt(me()))+".":"Paghi "+eur(b.pay.imp)+" in studio il giorno della seduta.")+'</p>')+
   (s.tipo==="corso"||(b.pay.m==="piano"&&me().rinnovo)?'<div style="max-width:560px;margin:16px auto 0;text-align:left">'+avvisoSedute()+'</div>':'')+
   '<div class="inline" style="justify-content:center;margin-top:18px"><button class="btn primary" onclick="const v=S.w&&S.w.viaPiano;S.w=null;if(v&&pianoAttivo(me()))usaAbbonamento();else render()">Prenota un\'altra</button></div></div>'}
const corsoSingolo=()=>(DB.listino.corsi||[]).find(r=>r.sed===1&&!/mensil/i.test(r.n))||null;

/* ---------- abbonamento mensile con rinnovo automatico ---------- */
const isMeseVoce=(k,r)=>!!(SEZ[k]&&SEZ[k].mese)||/mensil/i.test((r&&r.n)||"")||/mensil|al mese/i.test((r&&r.d)||"");
function addMese(iso_){const d=fromIso(iso_),g=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(g,ult));return iso(d)}
function rinnoviAuto(silenzio){let n=0;
  DB.clienti.forEach(c=>{if(!c.rinnovo||!c.scadIso||!c.tipo||c.tipo==="none")return;let giri=0;
    while(c.scadIso<T0&&giri<24){giri++;
      if(c.disdetta){c.rinnovo=false;c.fineDisdetta=c.scadIso;break}
      const da=c.scadIso,nuova=addMese(da);
      c.scadIso=nuova;c.scad=fmtD(nuova,{day:"numeric",month:"short"}).replace(".","");c.usate=0;n++;
      DB.movimenti.unshift({id:uid(),d:da,tipo:"entrata",desc:"Rinnovo automatico · "+c.piano+" (fino al "+fmtD(nuova,{day:"numeric",month:"short"})+")",cli:c.n,area:c.tipo==="mass"?"Trattamenti":c.tipo==="combo"?"Misti":"Allenamenti",imp:c.pMese||0,met:"Addebito automatico",pag:false});
      const t=chatDi(c.id),msg="Il tuo abbonamento “"+c.piano+"” si è rinnovato da solo: è valido fino al "+fmtD(nuova,{day:"numeric",month:"long"})+" e le sedute del mese sono di nuovo disponibili. Puoi disdire quando vuoi dall'app. — Kone";
      t.msgs.push({t:msg,me:1,h:oraLabel()});t.last=msg;t.unreadC=(t.unreadC||0)+1}});
  if(n&&!silenzio)save();return n}
function rinPill(c){if(!c.rinnovo)return "";return c.disdetta?' <span class="pill warn" title="Disdetto: non si rinnova">disdetto</span>':' <span class="pill info" title="Si rinnova da solo ogni mese">'+ic("refresh",10)+' rinnovo auto</span>'}
function rinnovoCard(){const c=me();if(!c||!c.rinnovo||!c.tipo||c.tipo==="none")return "";
  const fino=c.scadIso?fmtD(c.scadIso,{day:"numeric",month:"long"}):"fine mese";
  if(c.disdetta)return '<div class="alert warn rinbox"><div><b>Abbonamento disdetto</b><p>'+esc(c.piano)+' resta valido fino al '+fino+', poi non si rinnova e non ti viene addebitato più nulla.</p></div><button class="btn sm" onclick="riattivaAbb()">Riattiva</button></div>';
  return '<div class="alert info rinbox"><div><b>'+ic("refresh",14)+' Rinnovo automatico attivo</b><p>'+esc(c.piano)+(c.pMese?' · '+eur(c.pMese)+' al mese':'')+' · si rinnova da solo il '+fino+'. Puoi disdire quando vuoi.</p></div><button class="btn sm ghost" onclick="disdiciModal()">Disdici</button></div>'}
function disdiciModal(){const c=me(),fino=c.scadIso?fmtD(c.scadIso,{day:"numeric",month:"long"}):"fine mese";
  openModal('<h3>Disdire l\'abbonamento?</h3><p class="muted" style="margin-bottom:12px"><b>'+esc(c.piano)+'</b> resta attivo fino al <b>'+fino+'</b>: fino ad allora prenoti come sempre. Dopo non si rinnova più e non ti viene addebitato nulla.</p>'+
   (DB.settings.portale?'<p class="hint" style="margin-bottom:12px">Ti apriamo anche la pagina sicura dei pagamenti per fermare l\'addebito sul conto.</p>':'<p class="hint" style="margin-bottom:12px">Kone riceve subito la tua disdetta in chat e ferma l\'addebito.</p>')+
   '<div class="inline" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Tengo l\'abbonamento</button><button class="btn primary" onclick="disdiciAbb()">Disdici</button></div>')}
function msgAKone(cid,msg){const t=chatDi(cid);t.msgs.push({t:msg,me:0,h:oraLabel()});t.last=msg;t.unread=(t.unread||0)+1}
function disdiciAbb(){const c=me();c.disdetta=T0;msgAKone(c.id,"Ciao Kone, ho disdetto il mio abbonamento “"+c.piano+"” dall'app: vale fino al "+(c.scadIso?fmtD(c.scadIso,{day:"numeric",month:"long"}):"fine mese")+", poi non rinnovarlo. Grazie!");
  save();closeModal();render();toast("Disdetta registrata · Kone è stato avvisato");
  const p=safeUrl(DB.settings.portale);if(p){const w=window.open(p,"_blank");if(!w)location.href=p}}
function riattivaAbb(){const c=me();c.disdetta=null;msgAKone(c.id,"Ciao Kone, ho riattivato il rinnovo automatico del mio abbonamento “"+c.piano+"”.");save();render();toast("Rinnovo automatico riattivato")}
function linkModal(key,i){const r=DB.listino[key][i];
  openModal('<h3>Addebito automatico · '+esc(r.n)+'</h3><p class="muted" style="margin-bottom:12px">Incolla il link di pagamento <b>ricorrente mensile</b> di questa voce (Stripe → Link di pagamento → prezzo “Ricorrente, mensile”, metodi: addebito SEPA e carta). Il cliente lo apre dal listino, inserisce il suo IBAN o la carta e da lì paga ogni mese da solo finché non disdice.</p>'+
   '<div class="field"><label>Link di pagamento ricorrente</label><input class="fi" id="lkU" value="'+esc(r.link||"")+'" placeholder="https://buy.stripe.com/…"></div>'+
   '<div class="inline" style="justify-content:flex-end;flex-wrap:wrap">'+(r.link?'<button class="btn ghost" style="margin-right:auto" onclick="delete DB.listino.'+key+'['+i+'].link;save();closeModal();render();toast(\'Link tolto\')">Togli link</button>':'')+'<button class="btn primary" onclick="salvaLink(\''+key+'\','+i+')">Salva</button></div>')}
function salvaLink(key,i){const v=el("lkU").value.trim();if(v&&!safeUrl(v))return toast("Il link deve iniziare con https://");const r=DB.listino[key][i];if(v)r.link=v;else delete r.link;save();closeModal();render();toast(v?"Link salvato · i clienti attivano l'abbonamento da soli":"Link tolto")}
function attivaModal(key,i){const r=DB.listino[key][i],c=me(),pr=pEff(r);
  openModal('<h3>'+esc(r.n)+' · rinnovo automatico</h3><p class="muted" style="margin-bottom:12px">'+eur(pr)+' al mese'+(r.sed?' · '+r.sed+' sedute':r.sed===0?' · ingressi illimitati':'')+(r.d?' · '+esc(r.d):'')+'</p>'+
   '<ol class="pplist" style="margin-bottom:12px"><li>Paghi il primo mese e autorizzi l\'addebito mensile (IBAN del tuo conto o carta).</li><li>Ogni mese l\'abbonamento si rinnova da solo e le sedute ripartono.</li><li>Disdici quando vuoi dall\'app: resta valido fino a fine mese, poi non paghi più.</li></ol>'+avvisoSedute()+
   (r.link?'<div class="inline" style="justify-content:flex-end"><a class="btn primary" href="'+esc(safeUrl(r.link))+'" target="_blank" rel="noopener" onclick="richiestaAbb(\''+key+'\','+i+',1)">Attiva l\'addebito automatico '+ic("chevR",14)+'</a></div>'
    :'<p class="hint" style="margin-bottom:12px">L\'addebito online si sta attivando: intanto mandi la richiesta a Kone, che ti attiva l\'abbonamento'+(bon().iban?' e ti conferma i dati per il bonifico':'')+'.</p>'+(bon().iban?bonificoBox(pr,"Abbonamento "+r.n+" · "+(c?c.n:"")):'')+
     '<div class="inline" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="richiestaAbb(\''+key+'\','+i+')">Manda la richiesta a Kone</button></div>'))}
function richiestaAbb(key,i,link){const r=DB.listino[key][i],c=me();if(!c)return;
  msgAKone(c.id,"Ciao Kone, vorrei attivare l'abbonamento mensile “"+r.n+"” ("+eur(pEff(r))+" al mese) con rinnovo automatico."+(link?" Ho aperto il pagamento online.":""));save();
  if(!link){closeModal();render();toast("Richiesta inviata a Kone in chat")}}

/* =================== RENDER =================== */
function render(){
  const coach=S.role==="coach";
  const V=coach?{dash:vDash,agenda:vAgenda,clienti:vClienti,cliente:vCliente,chat:vChat,listino:vListino,pagamenti:vPagamenti,conti:vConti,schede:vSchede,libreria:vLibreria,corsi:vCorsi,nutrizione:vNutrizione,tratt:vTratt}
    :{oggi:vOggi,scheda:vScheda,prenota:vPrenota,prog:vProgC,dieta:vDieta,listino:vListino,chat:vChatC,tcat:vTcat,tpren:vTpren};
  const f=V[S.view]||(coach?vDash:vOggi);
  try{el("view").innerHTML=f()}catch(e){console.error(e);el("view").innerHTML='<div class="card"><p>Qualcosa non ha funzionato in questa pagina.</p><p class="hint">'+esc(e.message)+'</p></div>'}
  const m=el("msgs");if(m)m.scrollTop=m.scrollHeight;
  hydrate();
}
if(!window.KM_CLOUD){initDB();_pSig=prezziSig();caricaPrezzi();
setInterval(caricaPrezzi,180000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)caricaPrezzi()});}

</script>

<script>
/* =================== installa l'app sul telefono =================== */
(function(){
  let dp=null;const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),and=/android/i.test(ua);
  const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
  addEventListener("appinstalled",()=>{dp=null;document.querySelectorAll(".inst-btn").forEach(b=>b.remove());try{toast("App installata ✓")}catch(e){}});
  const SH='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#5C9BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  window.installApp=async function(){
    if(dp){dp.prompt();const r=await dp.userChoice;dp=null;return}
    let h='<h3>Installa KM Studio</h3><p class="muted" style="font-size:14px">Icona sulla schermata Home e apertura a tutto schermo, come un\'app vera.</p>';
    if(ios)h+='<ol class="inst-steps"><li><span>Apri questa pagina con <b>Safari</b>.</span></li><li><span>Tocca <b>Condividi</b> '+SH+' nella barra in basso.</span></li><li><span>Scegli <b>“Aggiungi alla schermata Home”</b> e poi <b>Aggiungi</b>.</span></li></ol>';
    else if(and)h+='<ol class="inst-steps"><li><span>Apri questa pagina con <b>Chrome</b>.</span></li><li><span>Tocca il menu <b>⋮</b> in alto a destra.</span></li><li><span>Scegli <b>“Installa app”</b> o <b>“Aggiungi a schermata Home”</b>.</span></li></ol>';
    else h+='<ol class="inst-steps"><li><span>Apri <b>kone-studio.com/app</b> dal telefono.</span></li><li><span>iPhone: Safari → <b>Condividi</b> → <b>Aggiungi alla schermata Home</b>.</span></li><li><span>Android: Chrome → menu <b>⋮</b> → <b>Installa app</b>.</span></li></ol>';
    openModal(h);
  };
  function addBtn(){if(standalone())return;
    const DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
    document.querySelectorAll("#cliForm").forEach(f=>{if(f.parentNode.querySelector(".inst-btn"))return;const b=document.createElement("button");b.type="button";b.className="inst-btn";b.innerHTML=DL+"Installa l'app sul telefono";b.onclick=installApp;(el("regForm")||f).insertAdjacentElement("afterend",b)});
  }
  if(document.readyState!=="loading")addBtn();else document.addEventListener("DOMContentLoaded",addBtn);
})();
</script>
