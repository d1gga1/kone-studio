<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KM Studio — Intro animata</title>
<meta name="description" content="Intro animata del logo Kone Moctar Studio.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#08080A; --ink-2:#101013; --surf:#16161A; --surf-2:#1D1D22; --surf-3:#26262C;
  --line:#2E2E35; --line-soft:#232329;
  --gold:#D9A93C; --gold-hi:#F7E3A1; --gold-mid:#E8C463; --gold-deep:#8A6415;
  --txt:#F3EFE6; --txt-2:#A9A296; --txt-3:#726C62;
  --ok:#4FA86A; --warn:#E0973A; --crit:#CE4B45; --info:#5C8BC4;
  --r:14px; --r-sm:9px;
  --shadow:0 18px 50px -18px rgba(0,0,0,.85);
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Oswald','Barlow Condensed',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--txt);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);}
.muted{color:var(--txt-2)}
.dim{color:var(--txt-3)}

/* ============ INTRO / SPLASH ============ */
#splash{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 40%,#1A150A 0%,#0B0A07 45%,#050505 100%);
  perspective:1400px;transition:opacity .7s ease,visibility .7s;
}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.stage{position:relative;width:min(86vw,560px);aspect-ratio:1;transform-style:preserve-3d;
  animation:stageIn 1.2s cubic-bezier(.16,.84,.34,1) both, stageFloat 7s 1.3s ease-in-out infinite;}
@keyframes stageIn{from{opacity:0;transform:translateZ(-380px) rotateX(24deg)}to{opacity:1;transform:none}}
@keyframes stageFloat{0%,100%{transform:rotateY(-7deg) rotateX(3deg)}50%{transform:rotateY(7deg) rotateX(-3deg)}}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.glow{position:absolute;inset:-14%;border-radius:50%;
  background:radial-gradient(circle,rgba(217,169,60,.30) 0%,rgba(217,169,60,.07) 42%,transparent 68%);
  filter:blur(22px);animation:pulse 4.2s ease-in-out infinite;transform:translateZ(-80px)}
@keyframes pulse{0%,100%{opacity:.55;transform:translateZ(-80px) scale(.95)}50%{opacity:1;transform:translateZ(-80px) scale(1.06)}}

.ring-outer{stroke-dasharray:1570;stroke-dashoffset:1570;animation:draw 1.5s .15s cubic-bezier(.4,0,.2,1) forwards}
.ring-inner{stroke-dasharray:1430;stroke-dashoffset:1430;animation:draw 1.5s .35s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

#gK{opacity:0;animation:flyL .95s .75s cubic-bezier(.18,.9,.28,1) forwards;transform-origin:30% 50%}
#gM{opacity:0;animation:flyR .95s .88s cubic-bezier(.18,.9,.28,1) forwards;transform-origin:70% 50%}
@keyframes flyL{0%{opacity:0;transform:translate3d(-190px,0,-240px) rotateY(-72deg)}100%{opacity:1;transform:none}}
@keyframes flyR{0%{opacity:0;transform:translate3d(190px,0,-240px) rotateY(72deg)}100%{opacity:1;transform:none}}
#gBar{opacity:0;animation:popIn .7s 1.45s cubic-bezier(.2,1.5,.4,1) forwards;transform-origin:22% 50%}
#gMass{opacity:0;animation:popIn .7s 1.60s cubic-bezier(.2,1.5,.4,1) forwards;transform-origin:78% 48%}
@keyframes popIn{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:none}}
#gStudio{opacity:0;animation:studioIn .9s 1.75s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes studioIn{0%{opacity:0;letter-spacing:1.4em}100%{opacity:1;letter-spacing:.34em}}
.rule{transform:scaleX(0);transform-origin:center;animation:ruleIn .8s 1.95s cubic-bezier(.3,.9,.3,1) forwards}
@keyframes ruleIn{to{transform:scaleX(1)}}
#gTag{opacity:0;animation:fadeUp .8s 2.15s ease forwards}
#gPill{opacity:0;animation:fadeUp .8s 2.40s ease forwards}
@keyframes fadeUp{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
.shine{animation:shine 3.4s 2.2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes shine{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(200%) skewX(-18deg)}}
.spark{opacity:0;animation:spark 3.6s linear infinite}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translateY(-190px) scale(.2)}}
.skip{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:101;font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);
  border:1px solid var(--line);padding:9px 16px;border-radius:99px;background:rgba(10,10,12,.6);backdrop-filter:blur(6px);
  opacity:0;animation:fadeUp .6s 1s ease forwards}
.skip:hover{color:var(--gold);border-color:var(--gold-deep)}
@media (prefers-reduced-motion:reduce){
  .stage,#gK,#gM,#gBar,#gMass,#gStudio,#gTag,#gPill,.rule,.ring-outer,.ring-inner,.shine,.spark,.glow{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}


#splash{position:fixed;inset:0;opacity:1!important;visibility:visible!important}
.replay{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:110;
  font-family:var(--disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);
  border:1px solid var(--line);padding:10px 20px;border-radius:99px;background:rgba(10,10,12,.6);backdrop-filter:blur(6px)}
.replay:hover{color:var(--gold);border-color:var(--gold-deep)}
</style></head><body>
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7E3A1"/><stop offset="28%" stop-color="#D9A93C"/>
    <stop offset="55%" stop-color="#8A6415"/><stop offset="78%" stop-color="#E8C463"/>
    <stop offset="100%" stop-color="#B98A22"/>
  </linearGradient>
  <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F7E3A1"/><stop offset="50%" stop-color="#D9A93C"/><stop offset="100%" stop-color="#9A7118"/>
  </linearGradient>
</defs></svg>
<div id="splash">
  <div class="stage">
    <div class="glow"></div>
    <svg viewBox="0 0 600 600" aria-label="KM Studio">
      <defs>
        <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="45%" stop-color="#fff" stop-opacity=".75"/>
          <stop offset="55%" stop-color="#fff" stop-opacity=".75"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="mKM">
          <rect x="0" y="0" width="600" height="600" fill="#000"/>
          <g transform="translate(157.5 184) scale(1.6)" fill="#fff"><path d="M0,0 H21 V40 L50,0 H74 L40,48 L76,100 H52 L21,55 V100 H0 Z"/><g transform="translate(86 0)"><path d="M0,100 V0 H22 L46,44 L70,0 H92 V100 H71 V38 L52,70 H40 L21,38 V100 Z"/></g></g>
        </mask>
      </defs>

      <circle cx="300" cy="300" r="252" fill="#0A0906"/>
      <circle class="ring-outer" cx="300" cy="300" r="250" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 300 300)"/>
      <circle class="ring-inner" cx="300" cy="300" r="228" fill="none" stroke="url(#gold2)" stroke-width="1.6" opacity=".55" transform="rotate(-90 300 300)"/>

      <!-- barbell -->
      <g id="gBar" fill="url(#gold2)">
        <rect x="128" y="296" width="86" height="14" rx="3"/>
        <rect x="108" y="278" width="14" height="50" rx="4"/>
        <rect x="89" y="264" width="15" height="78" rx="5"/>
        <rect x="74" y="278" width="11" height="50" rx="4"/>
      </g>
      <!-- massage line figure -->
      <g transform="translate(444 246) scale(.45)"><g id="gMass" fill="none" stroke="url(#gold2)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 106C68 84 120 88 158 97"/>
        <circle cx="180" cy="106" r="15"/>
        <path d="M8 132C70 148 140 148 196 128"/>
        <circle cx="58" cy="24" r="17"/>
        <path d="M58 44C46 58 44 76 52 90"/>
        <path d="M56 62C74 74 86 86 94 98"/>
      </g></g>

      <!-- letters -->
      <g id="gK"><g transform="translate(157.5 184) scale(1.6)"><path d="M0,0 H21 V40 L50,0 H74 L40,48 L76,100 H52 L21,55 V100 H0 Z" fill="url(#gold)"/></g></g>
      <g id="gM"><g transform="translate(295.1 184) scale(1.6)"><path d="M0,100 V0 H22 L46,44 L70,0 H92 V100 H71 V38 L52,70 H40 L21,38 V100 Z" fill="url(#gold)"/></g></g>
      <g mask="url(#mKM)"><rect class="shine" x="160" y="160" width="150" height="220" fill="url(#shineGrad)"/></g>

      <!-- studio -->
      <g>
        <rect class="rule" x="120" y="404" width="150" height="2.4" fill="url(#gold2)"/>
        <rect class="rule" x="330" y="404" width="150" height="2.4" fill="url(#gold2)"/>
        <text id="gStudio" x="300" y="416" text-anchor="middle" fill="url(#gold2)" font-family="Oswald,sans-serif" font-weight="600" font-size="46" letter-spacing=".34em" dx=".17em">STUDIO</text>
        <text id="gTag" x="300" y="452" text-anchor="middle" fill="#CBBC97" font-family="Barlow,sans-serif" font-weight="500" font-size="13.5" letter-spacing=".06em">PERSONAL TRAINING &amp; MASSAGGI PROFESSIONALI</text>
        <g id="gPill">
          <rect x="186" y="472" width="228" height="1.4" fill="#5E4A1C"/>
          <text x="300" y="499" text-anchor="middle" fill="#D9A93C" font-family="Barlow,sans-serif" font-weight="600" font-size="12.5" letter-spacing=".17em">MOVIMENTO · CURA · RISULTATI</text>
        </g>
      </g>
      <g fill="#F7E3A1">
        <circle class="spark" cx="130" cy="470" r="2.6" style="animation-delay:.2s"/>
        <circle class="spark" cx="470" cy="452" r="2" style="animation-delay:1.1s"/>
        <circle class="spark" cx="238" cy="500" r="2.2" style="animation-delay:2.1s"/>
        <circle class="spark" cx="392" cy="492" r="1.8" style="animation-delay:2.8s"/>
      </g>
    </svg>
  </div>
  </div>
<button class="replay" onclick="replay()">Riproduci di nuovo</button>
<script>
function replay(){var s=document.getElementById("splash"),n=s.cloneNode(true);s.parentNode.replaceChild(n,s);}
setInterval(replay,9000);
</script>
</body></html>
